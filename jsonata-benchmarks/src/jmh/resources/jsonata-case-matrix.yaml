    inputJson: '{"contacts":[{"id":"u-1","first":" Ada ","last":" Lovelace ","email":" ADA@Example.COM "},{"id":"u-2","first":" Grace","last":"Hopper ","email":"Grace.Hopper@EXAMPLE.com"}]}'
    branchlineProgram: |
