cases:
  - id: sum_prices
    jsonataExpression: '{"value": $sum(items.price)}'
    inputJson: '{"items":[{"price":10},{"price":20},{"price":30}]}'
    branchlineProgram: |
      TRANSFORM SumPrices {
          OUTPUT {
              value: SUM(MAP(input.items, (item) -> item.price)),
          };
      }
    kotlinEvalId: sum_prices
  - id: filter_names
    jsonataExpression: '{"items": items[price > 10].name}'
    inputJson: '{"items":[{"name":"a","price":5},{"name":"b","price":15},{"name":"c","price":25}]}'
    branchlineProgram: |
      TRANSFORM FilterNames {
          OUTPUT {
              items: MAP(
                  FILTER(input.items, (item) -> item.price > 10),
                  (item) -> item.name
              ),
          };
      }
    kotlinEvalId: filter_names
  - id: map_discount
    jsonataExpression: '{"items": $map(items, function($v){$v.price * 1.1})}'
    inputJson: '{"items":[{"price":100},{"price":150},{"price":200}]}'
    branchlineProgram: |
      TRANSFORM MapDiscount {
          OUTPUT {
              items: MAP(input.items, (item) -> item.price * 1.1),
          };
      }
    kotlinEvalId: map_discount
  - id: summary_stats
    jsonataExpression: '{"count": $count(items), "avg": $average(items.price)}'
    inputJson: '{"items":[{"price":4},{"price":6},{"price":10}]}'
    branchlineProgram: |
      TRANSFORM SummaryStats {
          OUTPUT {
              count: COUNT(input.items),
              avg: AVG(MAP(input.items, (item) -> item.price)),
          };
      }
    kotlinEvalId: summary_stats
  - id: etl-order-normalization
    jsonataExpression: |
      (
        $gross := $sum(items.(qty * price));
        {
          "orderId": order_id,
          "status": $exists(status) ? status : "NEW",
          "customer": {
            "id": customer.customer_id,
            "email": customer.email
          },
          "shipTo": {
            "country": shipping.country,
            "postalCode": shipping.postal
          },
          "lines": $map(items, function($item) {
            {
              "sku": $item.sku,
              "qty": $item.qty,
              "unitPrice": $item.price,
              "lineTotal": $item.qty * $item.price
            }
          }),
          "totals": {
            "gross": $gross,
            "discount": discount,
            "net": $gross - discount
          }
        }
      )
    inputJson: '{"order_id":"ord-1007","customer":{"customer_id":"cust-42","email":"buyer@example.com"},"shipping":{"country":"US","postal":"98101"},"discount":5.5,"items":[{"sku":"BK-001","qty":2,"price":12.5},{"sku":"PN-777","qty":1,"price":3.25},{"sku":"TB-030","qty":4,"price":2.0}]}'
    branchlineProgram: |
      TRANSFORM EtlOrderNormalization {
          LET gross = SUM(MAP(input.items, (item) -> item.qty * item.price))
          OUTPUT {
              orderId: input.order_id,
              status: GET(input, "status", "NEW"),
              customer: {
                  id: input.customer.customer_id,
                  email: input.customer.email,
              },
              shipTo: {
                  country: input.shipping.country,
                  postalCode: input.shipping.postal,
              },
              lines: [
                  {
                  sku: item.sku,
                  qty: item.qty,
                  unitPrice: item.price,
                  lineTotal: item.qty * item.price,
                  }
                  FOR EACH item IN input.items
              ],
              totals: {
                  gross: gross,
                  discount: input.discount,
                  net: gross - input.discount,
              },
          }
      }
    kotlinEvalId: etl-order-normalization
  - id: large-filter-map-aggregate
    jsonataExpression: |
      (
        $eligible := items[active = true and score >= 80];
        $weighted := $eligible.(score * weight);
        {
          "eligible": $map($eligible, function($item) {
            {
              "id": $item.id,
              "region": $item.region,
              "weighted": $item.score * $item.weight
            }
          }),
          "summary": {
            "count": $count($eligible),
            "weightedTotal": $sum($weighted),
            "avgWeighted": $average($weighted)
          }
        }
      )
    inputJson: '{"items":[{"id":"a1","region":"na","active":true,"score":91,"weight":1.1},{"id":"a2","region":"eu","active":false,"score":96,"weight":0.9},{"id":"a3","region":"na","active":true,"score":77,"weight":1.4},{"id":"a4","region":"apac","active":true,"score":88,"weight":1.2},{"id":"a5","region":"eu","active":true,"score":84,"weight":0.8},{"id":"a6","region":"latam","active":true,"score":93,"weight":1.0},{"id":"a7","region":"na","active":false,"score":82,"weight":1.3},{"id":"a8","region":"apac","active":true,"score":69,"weight":1.5}]}'
    branchlineProgram: |
      TRANSFORM LargeFilterMapAggregate {
          LET eligible = FILTER(input.items, (item) -> item.active == true && item.score >= 80)
          LET weighted = MAP(eligible, (item) -> item.score * item.weight)
          OUTPUT {
              eligible: [
                  {
                  id: item.id,
                  region: item.region,
                  weighted: item.score * item.weight,
                  }
                  FOR EACH item IN eligible
              ],
              summary: {
                  count: COUNT(eligible),
                  weightedTotal: SUM(weighted),
                  avgWeighted: AVG(weighted),
              },
          }
      }
    kotlinEvalId: large-filter-map-aggregate
  - id: contract-drift-projection
    jsonataExpression: |
      {
        "records": $map(accounts, function($account) {
          {
            "id": $account.id,
            "name": $exists($account.name) ? $account.name : ($exists($account.fullName) ? $account.fullName : "unknown"),
            "email": $exists($account.email) ? $account.email : "",
            "plan": $exists($account.plan) ? $account.plan : "free",
            "isActive": $exists($account.active) ? $account.active : true
          }
        })
      }
    inputJson: '{"accounts":[{"id":"u-1","name":"Ada Lovelace","email":"ada@example.com","plan":"pro","active":true},{"id":"u-2","fullName":"Grace Hopper","plan":"enterprise"},{"id":"u-3","email":"linus@example.com","active":false}]}'
    branchlineProgram: |
      TRANSFORM ContractDriftProjection {
          OUTPUT {
              records: [
                  {
                  id: account.id,
                  name: GET(account, "name", GET(account, "fullName", "unknown")),
                  email: GET(account, "email", ""),
                  plan: GET(account, "plan", "free"),
                  isActive: GET(account, "active", true),
                  }
                  FOR EACH account IN input.accounts
              ],
          }
      }
    kotlinEvalId: contract-drift-projection
  - id: numeric-precision-invoice
    jsonataExpression: |
      (
        $subtotal := $round($sum(lines.(quantity * unitPrice)), 2);
        $discountAmount := $round($subtotal * discountRate, 2);
        {
          "invoiceId": invoiceId,
          "externalRef": externalRef,
          "currency": currency,
          "subtotal": $subtotal,
          "discountAmount": $discountAmount,
          "shipping": shipping,
          "total": $round($subtotal - $discountAmount + shipping, 2)
        }
      )
    inputJson: '{"invoiceId":"inv-2026-0009","externalRef":"ref-90071992547409931234","currency":"USD","discountRate":0.075,"shipping":4.99,"lines":[{"sku":"svc-basic","quantity":2,"unitPrice":19.95},{"sku":"usage","quantity":3,"unitPrice":4.2},{"sku":"support","quantity":1,"unitPrice":15.0}]}'
    branchlineProgram: |
      TRANSFORM NumericPrecisionInvoice {
          LET subtotal = ROUND(SUM(MAP(input.lines, (line) -> line.quantity * line.unitPrice)), 2)
          LET discountAmount = ROUND(subtotal * input.discountRate, 2)
          OUTPUT {
              invoiceId: input.invoiceId,
              externalRef: input.externalRef,
              currency: input.currency,
              subtotal: subtotal,
              discountAmount: discountAmount,
              shipping: input.shipping,
              total: ROUND(subtotal - discountAmount + input.shipping, 2),
          }
      }
    kotlinEvalId: numeric-precision-invoice
  - id: api-envelope-shaping
    jsonataExpression: |
      {
        "meta": {
          "requestId": requestId,
          "ok": status = 200
        },
        "data": {
          "userId": data.user.id,
          "displayName": data.user.profile.displayName,
          "middleName": $exists(data.user.profile.middleName) ? data.user.profile.middleName : null,
          "roles": data.user.roles,
          "primaryEmail": data.user.emails[primary = true][0].address
        },
        "errors": $exists(errors) ? errors : []
      }
    inputJson: '{"requestId":"req-77","status":200,"data":{"user":{"id":"usr-9","profile":{"displayName":"Nora Park"},"roles":["admin","billing"],"emails":[{"address":"nora.work@example.com","primary":false},{"address":"nora@example.com","primary":true}]}}}'
    branchlineProgram: |
      TRANSFORM ApiEnvelopeShaping {
          LET user = input.data.user
          LET profile = user.profile
          LET primaryEmails = FILTER(user.emails, (email) -> email.primary == true)
          OUTPUT {
              meta: {
                  requestId: input.requestId,
                  ok: input.status == 200,
              },
              data: {
                  userId: user.id,
                  displayName: profile.displayName,
                  middleName: GET(profile, "middleName", null),
                  roles: user.roles,
                  primaryEmail: primaryEmails[0].address,
              },
              errors: GET(input, "errors", []),
          }
      }
    kotlinEvalId: api-envelope-shaping
  - id: nested-mapping-filtering
    jsonataExpression: |
      {
        "customers": $map(customers, function($customer) {
          {
            "id": $customer.id,
            "paidOrders": $map($customer.orders[status = "paid"], function($order) {
              {
                "id": $order.id,
                "lines": $map($order.lines[qty > 0], function($line) {
                  {
                    "sku": $line.sku,
                    "qty": $line.qty,
                    "lineTotal": $line.qty * $line.price
                  }
                }),
                "total": $sum($order.lines[qty > 0].(qty * price))
              }
            })
          }
        })
      }
    inputJson: '{"customers":[{"id":"cust-1","orders":[{"id":"ord-1","status":"paid","lines":[{"sku":"BK-001","qty":2,"price":12.5},{"sku":"PN-777","qty":1,"price":3.25}]},{"id":"ord-2","status":"draft","lines":[{"sku":"TB-030","qty":4,"price":2.0}]},{"id":"ord-4","status":"paid","lines":[{"sku":"TB-030","qty":2,"price":8.0},{"sku":"NT-010","qty":3,"price":1.75}]}]},{"id":"cust-2","orders":[{"id":"ord-3","status":"paid","lines":[{"sku":"BK-001","qty":1,"price":12.5},{"sku":"NT-010","qty":3,"price":1.75}]},{"id":"ord-5","status":"paid","lines":[{"sku":"PN-777","qty":2,"price":3.25},{"sku":"TB-030","qty":1,"price":8.0}]}]}]}'
    branchlineProgram: |
      TRANSFORM NestedMappingFiltering {
          OUTPUT {
              customers: [
                  {
                  id: customer.id,
                  paidOrders: [
                      {
                      id: order.id,
                      lines: [
                          {
                          sku: line.sku,
                          qty: line.qty,
                          lineTotal: line.qty * line.price,
                          }
                          FOR EACH line IN order.lines
                          WHERE line.qty > 0
                      ],
                      total: SUM([line.qty * line.price FOR EACH line IN order.lines WHERE line.qty > 0]),
                      }
                      FOR EACH order IN customer.orders
                      WHERE order.status == "paid"
                  ],
                  }
                  FOR EACH customer IN input.customers
              ],
          }
      }
    kotlinEvalId: nested-mapping-filtering
  - id: lookup-join-enrichment
    jsonataExpression: |
      {
        "orderId": orderId,
        "lines": $map(lines, function($line) {
          {
            "sku": $line.sku,
            "title": $lookup(catalog, $line.sku).title,
            "department": $lookup(catalog, $line.sku).department,
            "available": $lookup(inventory, $line.sku) >= $line.qty,
            "extended": $line.qty * $lookup(catalog, $line.sku).price
          }
        })
      }
    inputJson: '{"orderId":"ord-join-1","catalog":{"BK-001":{"title":"Branchline Handbook","department":"books","price":12.5},"PN-777":{"title":"Pipeline Notebook","department":"stationery","price":3.25},"TB-030":{"title":"Trace Board","department":"hardware","price":8.0}},"inventory":{"BK-001":3,"PN-777":0,"TB-030":10},"lines":[{"sku":"BK-001","qty":2},{"sku":"PN-777","qty":1},{"sku":"TB-030","qty":4}]}'
    branchlineProgram: |
      TRANSFORM LookupJoinEnrichment {
          OUTPUT {
              orderId: input.orderId,
              lines: [
                  {
                  sku: line.sku,
                  title: GET(GET(input.catalog, line.sku), "title"),
                  department: GET(GET(input.catalog, line.sku), "department"),
                  available: GET(input.inventory, line.sku) >= line.qty,
                  extended: line.qty * GET(GET(input.catalog, line.sku), "price"),
                  }
                  FOR EACH line IN input.lines
              ],
          }
      }
    kotlinEvalId: lookup-join-enrichment
  - id: string-object-construction
    jsonataExpression: |
      {
        "id": id,
        "slug": $lowercase($trim(firstName) & "-" & $trim(lastName)),
        "display": $trim(firstName) & " " & $trim(lastName),
        "tagLine": $join(tags, " / ")
      }
    inputJson: '{"id":"usr-42","firstName":" Ada ","lastName":" Lovelace ","tags":["math","programming","history"]}'
    branchlineProgram: |
      TRANSFORM StringObjectConstruction {
          OUTPUT {
              id: input.id,
              slug: LOWER(TRIM(input.firstName) + "-" + TRIM(input.lastName)),
              display: TRIM(input.firstName) + " " + TRIM(input.lastName),
              tagLine: JOIN(input.tags, " / "),
          }
      }
    kotlinEvalId: string-object-construction
  - id: xml-ish-shape
    jsonataExpression: |
      {
        "order": {
          "id": order."@id",
          "created": order."@created",
          "customer": {
            "id": order.customer."@id",
            "name": order.customer."#text"
          },
          "lines": $map(order.line, function($line) {
            {
              "sku": $line."@sku",
              "qty": $line."@qty",
              "text": $line."#text"
            }
          })
        }
      }
    inputJson: '{"order":{"@id":"ord-xml-1","@created":"2026-06-10","customer":{"@id":"cust-7","#text":"Ada Lovelace"},"line":[{"@sku":"BK-001","@qty":2,"#text":"Branchline Handbook"},{"@sku":"PN-777","@qty":1,"#text":"Pipeline Notebook"}]}}'
    branchlineProgram: |
      TRANSFORM XmlIshShape {
          OUTPUT {
              order: {
                  id: GET(input.order, "@id"),
                  created: GET(input.order, "@created"),
                  customer: {
                      id: GET(input.order.customer, "@id"),
                      name: GET(input.order.customer, "#text"),
                  },
                  lines: [
                      {
                      sku: GET(line, "@sku"),
                      qty: GET(line, "@qty"),
                      text: GET(line, "#text"),
                      }
                      FOR EACH line IN input.order.line
                  ],
              },
          }
      }
    kotlinEvalId: xml-ish-shape
  - id: contract-error-branches
    jsonataExpression: |
      (
        $errors := $exists(errors) ? errors : [];
        {
          "ok": status >= 200 and status < 300 and $count($errors) = 0,
          "kind": status >= 500 ? "retryable" : (status >= 400 ? "client_error" : "ok"),
          "message": $exists(error.message) ? error.message : "",
          "payload": status = 200 ? data : null
        }
      )
    inputJson: '{"status":409,"data":{"id":"obj-1","version":3},"error":{"message":"version conflict"},"errors":[{"code":"VERSION_CONFLICT","field":"version"}]}'
    branchlineProgram: |
      TRANSFORM ContractErrorBranches {
          LET errors = GET(input, "errors", [])
          OUTPUT {
              ok: input.status >= 200 && input.status < 300 && COUNT(errors) == 0,
              kind: CASE {
                  WHEN input.status >= 500 THEN "retryable"
                  WHEN input.status >= 400 THEN "client_error"
                  ELSE "ok"
              },
              message: GET(GET(input, "error", {}), "message", ""),
              payload: IF input.status == 200 THEN input.data ELSE null,
          }
      }
    kotlinEvalId: contract-error-branches
  - id: jsonata-migration-pack-01
    jsonataExpression: |
      {
        "customers": $map(customers, function($customer) {
          {
            "id": $customer.id,
            "name": $customer.name,
            "segment": $lookup(segments, $customer.segmentCode),
            "country": $lookup(countries, $customer.countryCode)
          }
        })
      }
    inputJson: '{"segments":{"A":"enterprise","B":"mid-market"},"countries":{"US":"United States","DE":"Germany"},"customers":[{"id":"c-1","name":"Acme","segmentCode":"A","countryCode":"US"},{"id":"c-2","name":"Globex","segmentCode":"B","countryCode":"DE"}]}'
    branchlineProgram: |
      TRANSFORM JsonataMigrationPack01 {
          OUTPUT {
              customers: [
                  {
                  id: customer.id,
                  name: customer.name,
                  segment: GET(input.segments, customer.segmentCode),
                  country: GET(input.countries, customer.countryCode),
                  }
                  FOR EACH customer IN input.customers
              ],
          }
      }
    kotlinEvalId: jsonata-migration-pack-01
  - id: jsonata-migration-pack-02
    jsonataExpression: |
      {
        "contacts": $map(contacts, function($contact) {
          {
            "id": $contact.id,
            "email": $lowercase($trim($contact.email)),
            "initials": $uppercase($substring($trim($contact.first), 0, 1) & $substring($trim($contact.last), 0, 1))
          }
